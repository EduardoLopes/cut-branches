pre-commit:
  parallel: false
  commands:
    eslint:
      priority: 2
      glob: '*.{js,ts,jsx,tsx,cjs,mjs,svelte}'
      run: pnpm eslint {staged_files} --fix && git add {staged_files}
    prettier:
      priority: 2
      glob: '*.{js,ts,jsx,tsx,cjs,mjs,svelte,html,json,yml,md}'
      run: pnpm prettier --write {staged_files} && git add {staged_files}
    typecheck:
      priority: 3
      glob: '*.{ts,tsx,svelte}'
      run: pnpm svelte-check
    test:
      priority: 4
      glob: '*.{js,ts,jsx,tsx,svelte}'
      run: HEADLESS=true pnpm vitest related {staged_files} --run --silent --coverage=false
    tauri-tests:
      priority: 4
      glob: '*.rs'
      run: pnpm test:cargo
    domain-boundaries:
      priority: 3
      glob: '*.rs'
      run: bash src-tauri/scripts/check-domain-boundaries.sh --strict

commit-msg:
  scripts:
    'commitlint.sh':
      runner: bash
