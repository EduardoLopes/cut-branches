pre-commit:
  parallel: false
  commands:
    clean-pindoba:
      priority: 1
      run: bash scripts/manage-pindoba-links.sh clean
    eslint:
      priority: 2
      glob: '*.{js,ts,jsx,tsx,cjs,mjs,svelte}'
      run: pnpm eslint {staged_files} --fix && git add {staged_files}
    prettier:
      priority: 2
      glob: '*.{js,ts,jsx,tsx,cjs,mjs,svelte,html,json,yml,md}'
      run: pnpm prettier --write {staged_files} && git add {staged_files}
    typecheck:
      priority: 3
      glob: '*.{ts,tsx,svelte}'
      run: pnpm svelte-check
    test:
      priority: 4
      glob: '*.{js,ts,jsx,tsx,svelte}'
      run: pnpm vitest related {staged_files} --run --silent --coverage=false
    tauri-tests:
      priority: 4
      glob: '*.rs'
      run: pnpm test:cargo

commit-msg:
  scripts:
    'commitlint.sh':
      runner: bash

post-commit:
  commands:
    restore-pindoba:
      run: |
        # Check if .env exists and USE_LOCAL_PINDOBA is true
        if [ -f .env ] && grep -q "^USE_LOCAL_PINDOBA=true" .env; then
          echo "🔄 Restoring Pindoba links..."
          bash scripts/manage-pindoba-links.sh auto-link
          echo "📦 Installing linked packages..."
          pnpm install --ignore-scripts
        fi
